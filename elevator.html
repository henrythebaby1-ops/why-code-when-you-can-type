<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The So Crazy Elevator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root { --bg: #120d20; --ink: #fff6e8; --muted: #b7a9d1; --coral: #ff6b57; --sun: #ffb72b; --mint: #18b98a; --purple: #6b3fd6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: "Nunito", system-ui, sans-serif; overflow: hidden; -webkit-user-select: none; user-select: none; touch-action: none; }
  #stage { position: fixed; inset: 0; display: grid; place-items: center; }
  canvas { display: block; border-radius: 18px; box-shadow: 0 30px 80px -20px rgba(0,0,0,.8); }
  .overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; background: radial-gradient(ellipse at center, rgba(18,13,32,.55), rgba(18,13,32,.92)); z-index: 5; }
  .overlay.hidden { display: none; }
  .panel { width: min(480px, 100%); background: #1f1734; border: 3px solid #3b2d5c; border-radius: 26px; padding: 26px; text-align: center; box-shadow: 0 30px 60px -20px #000; }
  .panel h1 { font-family: Fredoka; font-size: clamp(30px, 7vw, 42px); line-height: 1; margin: 0 0 6px; }
  .panel h1 span { color: var(--coral); }
  .panel p { color: var(--muted); line-height: 1.5; margin: 8px 0 16px; font-weight: 600; }
  .panel input { width: 100%; font: inherit; font-size: 20px; font-weight: 900; text-align: center; padding: 12px; border-radius: 14px; border: 3px solid #3b2d5c; background: #120d20; color: var(--ink); outline: none; }
  .panel input:focus { border-color: #8f6bff; }
  .colors { display: flex; justify-content: center; gap: 10px; margin: 14px 0 18px; flex-wrap: wrap; }
  .colors button { width: 38px; height: 38px; border-radius: 50%; border: 3px solid transparent; cursor: pointer; }
  .colors button.on { border-color: #fff; transform: scale(1.12); }
  .go { appearance: none; border: 0; font: inherit; font-weight: 900; font-size: 20px; color: #fff; background: var(--coral); padding: 14px 28px; border-radius: 16px; cursor: pointer; box-shadow: 0 6px 0 #c94130; width: 100%; }
  .go:active { transform: translateY(4px); box-shadow: 0 2px 0 #c94130; }
  .keys { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); font-weight: 800; margin-top: 14px; }
  kbd { background: #120d20; border: 2px solid #3b2d5c; border-bottom-width: 4px; border-radius: 7px; padding: 1px 7px; font-family: inherit; color: var(--ink); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0; }
  .stats div { background: #120d20; border-radius: 14px; padding: 10px 4px; }
  .stats b { display: block; font-family: Fredoka; font-size: 26px; }
  .stats span { font-size: 12px; color: var(--muted); font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
  .top { position: fixed; top: 10px; left: 12px; right: 12px; display: flex; justify-content: space-between; z-index: 6; pointer-events: none; }
  .top a, .top button { pointer-events: auto; text-decoration: none; color: var(--muted); font-weight: 800; background: rgba(31,23,52,.85); border: 2px solid #3b2d5c; padding: 6px 12px; border-radius: 999px; font: inherit; font-weight: 800; cursor: pointer; }
  .touch { position: fixed; bottom: 14px; left: 0; right: 0; display: none; justify-content: space-between; padding: 0 14px; z-index: 4; pointer-events: none; }
  .touch .grp { display: flex; gap: 12px; pointer-events: auto; }
  .touch button { width: 70px; height: 70px; border-radius: 50%; border: 3px solid rgba(255,255,255,.25); background: rgba(31,23,52,.6); color: #fff; font-size: 28px; font-weight: 900; touch-action: none; }
  .touch button.jump { width: 84px; height: 84px; background: rgba(255,107,87,.55); }
  @media (pointer: coarse) { .touch { display: flex; } }
  .left-link { color: var(--muted); }
</style>
</head>
<body>
<div class="top"><a href="./">← Games</a><button id="mute">🔊 Sound</button></div>
<div id="stage"><canvas id="c"></canvas></div>

<div class="overlay" id="menu">
  <div class="panel">
    <h1>The So <span>Crazy</span> Elevator</h1>
    <p>You and a bunch of strangers are stuck in one elevator, and every floor has its own disaster. Dodge it, jump over it, and try to outlast everyone.</p>
    <input id="name" maxlength="12" placeholder="Your name" autocomplete="off">
    <div class="colors" id="colors"></div>
    <button class="go" id="play">Press the button 🔼</button>
    <div class="keys"><span><kbd>←</kbd><kbd>→</kbd> / <kbd>A</kbd><kbd>D</kbd> move</span><span><kbd>Space</kbd> / <kbd>W</kbd> jump</span></div>
    <p id="bestLine" style="margin-bottom:0"></p>
  </div>
</div>

<div class="overlay hidden" id="over">
  <div class="panel">
    <h1 id="overTitle">Flattened!</h1>
    <p id="overSub"></p>
    <div class="stats"><div><b id="stFloor">0</b><span>Floors</span></div><div><b id="stCoins">0</b><span>Coins</span></div><div><b id="stScore">0</b><span>Score</span></div></div>
    <button class="go" id="again">Ride again</button>
  </div>
</div>

<div class="touch"><div class="grp"><button id="tl">◀</button><button id="tr">▶</button></div><div class="grp"><button class="jump" id="tj">⤒</button></div></div>

<script>
(() => {
"use strict";
// ---------- setup ----------
const cvs = document.getElementById("c"), ctx = cvs.getContext("2d");
const W = 960, H = 540, LW = 70, RW = 890, FLOOR = 468, CEIL = 104;
let scale = 1;
function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const s = Math.min(innerWidth / W, (innerHeight - 10) / H);
  scale = s;
  cvs.style.width = W * s + "px"; cvs.style.height = H * s + "px";
  cvs.width = Math.round(W * s * dpr); cvs.height = Math.round(H * s * dpr);
  ctx.setTransform(s * dpr, 0, 0, s * dpr, 0, 0);
}
addEventListener("resize", resize); resize();

const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

const COLORS = ["#ff6b57", "#3aa5ff", "#18b98a", "#ffb72b", "#b26bff", "#ff5fa2", "#53d6e0", "#9bd14a"];
const BOT_NAMES = ["Pickle", "Gus", "Noodle", "Big Tony", "Marge", "Dr. Toast", "Beans", "Kevin", "Waffles", "Sir Hops", "Lulu", "Mochi", "Grandma Jo",
  "Sprout", "Taco", "Ziggy", "Pumpkin", "Wobbles", "Dave", "Nugget", "Biscuit", "Fern", "Captain Sock", "Jelly", "Moose", "Penny", "Elevator Ed"];
const CHATTER = {
  board: ["hi everyone 👋", "going up?", "is this the express?", "hold the door!!", "why is it so warm in here", "first day, be nice", "I took the stairs last time…"],
  idle: ["who pressed every button??", "I'm not paid enough for this", "this elevator needs a manager", "smells like piano in here", "my mom said this would be fun",
    "anyone got snacks", "I'm telling the landlord", "is it just me or is it crazy in here", "this is fine 🙂", "next time I'm taking the stairs"],
  hurt: ["OW", "my toes!!", "rude!", "that's gonna bruise", "who did that", "not again"],
};
const DEATH = { drop: ["got pianoed 🎹", "was flattened", "met a falling couch", "got anvil'd"], lava: ["took a lava bath 🌋", "got toasted"], ball: ["got bonked by a ball", "was bounced out"],
  laser: ["got zapped ⚡", "walked into a laser"], saw: ["tripped over a saw", "got sliced 🪚"], paw: ["got swatted by the cat 🐈", "was booped way too hard"], bomb: ["went boom 💣"], spike: ["got poked"] };

// ---------- audio ----------
let AC = null, muted = store.get("sce-muted") === "1";
const muteBtn = document.getElementById("mute");
const setMuteLabel = () => muteBtn.textContent = muted ? "🔇 Muted" : "🔊 Sound";
setMuteLabel();
muteBtn.onclick = () => { muted = !muted; store.set("sce-muted", muted ? "1" : "0"); setMuteLabel(); muteBtn.blur(); };
function tone(freq, dur, type = "sine", vol = .12, slide = 0, delay = 0) {
  if (muted) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + dur + .02);
  } catch {}
}
const sfx = {
  ding: () => { tone(1046, .5, "sine", .16); tone(784, .7, "sine", .16, 0, .22); },
  jump: () => tone(380, .14, "square", .05, 300),
  hit: () => { tone(160, .25, "sawtooth", .12, -100); },
  coin: () => { tone(988, .08, "square", .06); tone(1318, .15, "square", .06, 0, .07); },
  thud: () => tone(90, .3, "triangle", .2, -50),
  zap: () => tone(1200, .2, "sawtooth", .05, -900),
  warn: () => tone(660, .08, "square", .04),
  boom: () => { tone(120, .5, "sawtooth", .15, -90); tone(60, .5, "triangle", .2); },
  meow: () => { tone(700, .35, "sawtooth", .07, 300); tone(900, .3, "sawtooth", .05, -400, .2); },
};

// ---------- input ----------
const keys = {};
addEventListener("keydown", e => {
  if (document.activeElement && document.activeElement.tagName === "INPUT") return;
  keys[e.code] = true;
  if (["Space", "ArrowUp", "ArrowLeft", "ArrowRight", "ArrowDown"].includes(e.code)) e.preventDefault();
});
addEventListener("keyup", e => keys[e.code] = false);
const touch = { l: false, r: false, j: false };
for (const [id, k] of [["tl", "l"], ["tr", "r"], ["tj", "j"]]) {
  const b = document.getElementById(id);
  b.addEventListener("pointerdown", e => { touch[k] = true; e.preventDefault(); });
  for (const ev of ["pointerup", "pointerleave", "pointercancel"]) b.addEventListener(ev, () => touch[k] = false);
}

// ---------- state ----------
let chars = [], hazards = [], parts = [], feed = [], platforms = [];
let phase = "menu", floor = 0, phaseT = 0, ev = null, evT = 0, shake = 0, lava = FLOOR + 40, dark = 0, gravity = 1900;
let player = null, myColor = COLORS[0], banner = null, tAll = 0, flash = 0;
let lastEvents = [];

function makeChar(name, color, isPlayer) {
  return { name, color, isPlayer, x: rand(LW + 40, RW - 80), y: FLOOR - 36, w: 34, h: 34, vx: 0, vy: 0, onGround: true, face: 1,
    hp: isPlayer ? 3 : randi(2, 3), inv: 1.5, alive: true, coins: 0, squash: 0, blink: rand(1, 4), say: null, sayT: 0,
    ai: { tx: rand(LW + 60, RW - 60), think: 0, skill: rand(.45, .95), jumpCd: 0, chatter: rand(4, 14) }, dropIn: isPlayer ? 0 : 1 };
}
function addBot() {
  const used = new Set(chars.map(c => c.name));
  const name = pick(BOT_NAMES.filter(n => !used.has(n)));
  const c = makeChar(name, pick(COLORS), false);
  c.y = CEIL; c.vy = 0; c.onGround = false;
  chars.push(c);
  if (Math.random() < .6) speak(c, pick(CHATTER.board));
  return c;
}
function speak(c, text) { c.say = text; c.sayT = 2.6; }
function pushFeed(text, color = "#fff") { feed.unshift({ text, t: 5, color }); feed.length = Math.min(feed.length, 5); }

// ---------- events ----------
const EVENTS = {
  piano: { name: "Piano Delivery", sub: "Someone ordered a piano. Watch the shadows!", tint: "#ffb72b",
    start() { this.cd = .3; }, update(dt, d) { this.cd -= dt; if (this.cd <= 0) { this.cd = rand(.45, .85) / d; spawnDrop(); } } },
  lava: { name: "The Floor Is Lava", sub: "Get up on the shelves. Quick!", tint: "#ff5a2a",
    start() { makePlatforms(); }, update(dt, d) {
      const target = evT < 1.6 ? FLOOR + 40 : evT > ev.dur - 1.6 ? FLOOR + 40 : FLOOR - 56;
      lava += (target - lava) * Math.min(1, dt * (target < lava ? 1.4 : 2.5));
      this.cd = (this.cd || 0) - dt;
      if (this.cd <= 0 && lava < FLOOR) { this.cd = rand(.1, .25); parts.push({ x: rand(LW, RW), y: lava, vx: rand(-30, 30), vy: rand(-260, -120), life: .8, max: .8, r: rand(3, 6), c: pick(["#ffb72b", "#ff6b2a", "#ffe066"]), g: 600 }); }
    }, end() { lava = FLOOR + 40; platforms = []; } },
  balls: { name: "Bouncy Castle", sub: "Big bouncy balls. They do not say sorry.", tint: "#ff5fa2",
    start() { const n = Math.min(2 + Math.floor(floor / 4), 5); for (let i = 0; i < n; i++) setTimeout(() => phase === "event" && spawnBall(), i * 700); }, update() {} },
  laser: { name: "Laser Tag", sub: "Low beam, jump. High beam, stay low.", tint: "#ff3355",
    start() { this.cd = .6; }, update(dt, d) { this.cd -= dt; if (this.cd <= 0) { this.cd = rand(1.1, 1.8) / d; spawnLaser(); } } },
  saw: { name: "Sawmill", sub: "Saw blades rolling through. Hop over them.", tint: "#9aa7b8",
    start() { this.cd = .5; }, update(dt, d) { this.cd -= dt; if (this.cd <= 0) { this.cd = rand(.9, 1.6) / d; spawnSaw(); } } },
  coins: { name: "Coin Shower", sub: "Bonus floor! Grab the coins, dodge the bombs.", tint: "#ffd84a",
    start() { this.cd = 0; }, update(dt, d) { this.cd -= dt; if (this.cd <= 0) { this.cd = rand(.12, .3); spawnCoin(Math.random() < .14 + floor * .006); } } },
  moon: { name: "Moon Mode", sub: "Gravity took the day off. Meteors did not.", tint: "#8fb7ff", gravity: 650,
    start() { this.cd = .5; }, update(dt, d) { this.cd -= dt; if (this.cd <= 0) { this.cd = rand(.5, .9) / d; spawnDrop("meteor"); } } },
  dark: { name: "Lights Out", sub: "Who turned off the lights?? Saws, probably.", tint: "#3b2d5c",
    start() { this.cd = 1; }, update(dt, d) { dark = Math.min(1, dark + dt * 1.5); this.cd -= dt; if (this.cd <= 0) { this.cd = rand(1.1, 1.8) / d; Math.random() < .5 ? spawnSaw() : spawnDrop(); } }, end() {} },
  cat: { name: "Giant Cat", sub: "A huge cat noticed you. It wants to play.", tint: "#ffa94d",
    start() { this.cd = .8; sfx.meow(); }, update(dt, d) { this.cd -= dt; if (this.cd <= 0) { this.cd = rand(.7, 1.2) / d; spawnPaw(); } } },
};
const EVENT_KEYS = Object.keys(EVENTS);

function nextEventKey() {
  let opts = EVENT_KEYS.filter(k => !lastEvents.includes(k));
  if (floor < 2) opts = opts.filter(k => ["piano", "saw", "coins"].includes(k));
  if (floor % 5 === 4) opts = ["coins"].filter(k => !lastEvents.includes(k)).concat(opts.filter(k => k !== "coins")).slice(0, 1);
  const k = pick(opts.length ? opts : EVENT_KEYS);
  lastEvents.push(k); if (lastEvents.length > 3) lastEvents.shift();
  return k;
}

// ---------- spawners ----------
function difficulty() { return 1 + floor * 0.07; }
function spawnDrop(kind) {
  kind = kind || pick(["piano", "piano", "anvil", "couch", "fridge"]);
  const size = { piano: [96, 64], anvil: [56, 36], couch: [120, 46], fridge: [54, 86], meteor: [44, 44] }[kind];
  // aim near a random character sometimes
  const alive = chars.filter(c => c.alive);
  const target = alive.length && Math.random() < .55 ? pick(alive).x + 17 : rand(LW + 50, RW - 50);
  const x = clamp(target - size[0] / 2 + rand(-30, 30), LW + 4, RW - size[0] - 4);
  hazards.push({ type: "drop", kind, x, y: CEIL - size[1], w: size[0], h: size[1], vy: 0, t: 0, warn: kind === "meteor" ? .8 : 1.0, landed: 0, rot: rand(-.2, .2) });
}
function spawnBall() {
  const r = rand(26, 40), x = Math.random() < .5 ? LW + r + 4 : RW - r - 4;
  hazards.push({ type: "ball", x, y: CEIL + r + 10, r, vx: (x < W / 2 ? 1 : -1) * rand(160, 260), vy: 0, bounceV: rand(780, 950), t: 0, hue: pick(["#ff5fa2", "#53d6e0", "#ffb72b", "#9bd14a", "#b26bff"]) });
}
function spawnLaser() {
  if (Math.random() < .3) {
    const x = rand(LW + 40, RW - 40);
    hazards.push({ type: "laser", dir: "v", x, t: 0, warn: 1.0, on: .5 });
  } else {
    const low = Math.random() < .6;
    hazards.push({ type: "laser", dir: "h", y: low ? FLOOR - 14 : FLOOR - 62, low, t: 0, warn: 1.05, on: .45 });
  }
}
function spawnSaw() {
  const fromLeft = Math.random() < .5, r = rand(18, 26);
  hazards.push({ type: "saw", x: fromLeft ? LW - r : RW + r, y: FLOOR - r, r, vx: (fromLeft ? 1 : -1) * rand(230, 330) * Math.min(1.5, difficulty()), t: 0, rot: 0, warnSide: fromLeft ? -1 : 1 });
}
function spawnCoin(bomb) {
  hazards.push({ type: bomb ? "bomb" : "coin", x: rand(LW + 20, RW - 20), y: CEIL - 10, r: bomb ? 16 : 11, vy: rand(140, 230), t: 0, boom: 0, spin: rand(0, 6) });
}
function spawnPaw() {
  const alive = chars.filter(c => c.alive);
  const tx = alive.length && Math.random() < .7 ? pick(alive).x + 17 : rand(LW + 60, RW - 60);
  const w = 120;
  hazards.push({ type: "paw", x: clamp(tx - w / 2, LW, RW - w), w, t: 0, warn: .95, y: CEIL - 160 });
}
function makePlatforms() {
  platforms = [];
  const n = 4, span = (RW - LW) / n;
  for (let i = 0; i < n; i++) {
    const w = rand(120, 150);
    platforms.push({ x: LW + span * i + (span - w) / 2 + rand(-12, 12), y: FLOOR - rand(108, 128), w, h: 14 });
  }
}

// ---------- flow ----------
function startGame() {
  const nm = (document.getElementById("name").value.trim() || "You").slice(0, 12);
  store.set("sce-name", nm);
  chars = []; hazards = []; parts = []; feed = []; platforms = []; lastEvents = [];
  player = makeChar(nm, myColor, true); player.x = W / 2 - 17; chars.push(player);
  const n = 6;
  for (let i = 0; i < n; i++) { const b = addBot(); b.y = FLOOR - 34; b.onGround = true; b.dropIn = 0; b.x = LW + 40 + (i + (i >= 3 ? 1 : 0)) * ((RW - LW - 80) / 7); }
  floor = 0; lava = FLOOR + 40; dark = 0; gravity = 1900;
  beginRide();
  document.getElementById("menu").classList.add("hidden");
  document.getElementById("over").classList.add("hidden");
  pushFeed("Doors closing… everybody in!", "#b7a9d1");
}
function beginRide() {
  phase = "ride"; phaseT = 0;
  if (ev && ev.end) ev.end();
  ev = null; hazards = hazards.filter(h => h.type === "drop" && h.landed); dark = 0; gravity = 1900; platforms = []; lava = FLOOR + 40;
  // new passengers join if it's getting empty
  const aliveBots = chars.filter(c => c.alive && !c.isPlayer).length;
  const joins = aliveBots < 3 ? randi(2, 3) : aliveBots < 5 ? randi(0, 2) : 0;
  chars = chars.filter(c => c.alive);
  for (let i = 0; i < joins; i++) setTimeout(() => { if (phase !== "over") { const b = addBot(); pushFeed(`${b.name} hopped in`, "#53d6e0"); } }, 600 + i * 500);
  // small heal every 3 floors
  if (floor > 0 && floor % 3 === 0 && player.alive && player.hp < 3) { player.hp++; pushFeed("You found a snack. +1 ❤️", "#18b98a"); }
}
function beginEvent() {
  floor++;
  const k = nextEventKey();
  ev = EVENTS[k]; ev.key = k; ev.dur = 13 + Math.min(floor * .25, 5); evT = 0;
  gravity = ev.gravity || 1900;
  ev.start && ev.start();
  phase = "event"; phaseT = 0;
  banner = { floor, name: ev.name, sub: ev.sub, t: 0, tint: ev.tint };
  sfx.ding(); flash = .5;
  // someone comments
  const talkers = chars.filter(c => c.alive && !c.isPlayer);
  if (talkers.length && Math.random() < .8) speak(pick(talkers), pick(CHATTER.idle));
}
function gameOver() {
  phase = "over";
  const score = floor * 100 + player.coins * 25;
  const best = +(store.get("sce-best") || 0);
  if (score > best) store.set("sce-best", score);
  const survivors = chars.filter(c => c.alive).length;
  document.getElementById("overTitle").textContent = pick(["Flattened!", "Out of the elevator!", "That's your floor.", "Ouch."]);
  document.getElementById("overSub").textContent = (score > best ? "New personal best! 🎉 " : `Best: ${best}. `) +
    `You lasted ${floor} floor${floor === 1 ? "" : "s"}. ${survivors} passenger${survivors === 1 ? " is" : "s are"} still riding without you.`;
  document.getElementById("stFloor").textContent = floor;
  document.getElementById("stCoins").textContent = player.coins;
  document.getElementById("stScore").textContent = score;
  setTimeout(() => document.getElementById("over").classList.remove("hidden"), 1300);
}

// ---------- physics ----------
function hurt(c, cause, srcX) {
  if (!c.alive || c.inv > 0 || c.dropIn > 0) return;
  c.hp--; c.inv = 1.4;
  c.vy = -520; c.vx = (c.x + 17 < (srcX ?? c.x + 17) ? -1 : 1) * 260; c.onGround = false;
  burst(c.x + 17, c.y + 17, c.color, 14);
  if (c.isPlayer) { sfx.hit(); shake = Math.max(shake, 10); flash = .25; }
  else if (Math.random() < .5) speak(c, pick(CHATTER.hurt));
  if (c.hp <= 0) {
    c.alive = false;
    burst(c.x + 17, c.y + 17, c.color, 30);
    const msg = pick(DEATH[cause] || ["was eliminated"]);
    pushFeed(`${c.isPlayer ? "You" : c.name} ${msg}`, c.isPlayer ? "#ff6b57" : "#fff");
    if (c.isPlayer) gameOver();
  }
}
function burst(x, y, color, n) {

  const blink = .5 + .5 * Math.sin(tAll * 22);

    ctx.fillStyle = `rgba(30,10,40,${.15 + .3 * k})`;
    ctx.beginPath(); ctx.ellipse(h.x + h.w / 2, FLOOR + 2, h.w / 2 * (.5 + .5 * k), 8, 0, 0, 7); ctx.fill();
    if (h.t < h.warn) { ctx.fillStyle = `rgba(255,80,60,${.4 + .6 * blink})`; ctx.font = "900 26px Nunito"; ctx.textAlign = "center"; ctx.fillText("!", h.x + h.w / 2, CEIL + 24); }
  }
  if (h.type === "paw" && h.t < h.warn) {
    ctx.fillStyle = `rgba(255,150,60,${.12 + .2 * blink})`; ctx.fillRect(h.x, CEIL, h.w, FLOOR - CEIL);
    ctx.fillStyle = "rgba(30,10,40,.35)"; ctx.beginPath(); ctx.ellipse(h.x + h.w / 2, FLOOR + 2, h.w / 2 * (h.t / h.warn), 9, 0, 0, 7); ctx.fill();

function drawHazard(h) {

function drawProp(kind, w, h) {

    ctx.fillStyle = "#d9665c"; rr(x + 10, y, w - 20, h * .55, 10); ctx.fill();
    ctx.fillStyle = "#a8433c"; rr(x, y + h * .25, 16, h * .75, 7); ctx.fill(); rr(x + w - 16, y + h * .25, 16, h * .75, 7); ctx.fill();

    ctx.fillStyle = "#6b5242"; ctx.beginPath(); ctx.arc(0, 0, w / 2, 0, 7); ctx.fill();
    ctx.fillStyle = "#4a382d"; ctx.beginPath(); ctx.arc(-6, -4, 6, 0, 7); ctx.arc(8, 6, 4, 0, 7); ctx.fill();

}

function drawPaw(h) {
  const x = h.x, w = h.w, y = h.y;
  ctx.save(); ctx.beginPath(); ctx.rect(LW, CEIL - 12, RW - LW, FLOOR - CEIL + 60); ctx.clip();
  // arm
  ctx.fillStyle = "#f2a65a"; ctx.fillRect(x + 18, y - 400, w - 36, 420);
  ctx.fillStyle = "#d9863a"; for (let i = 0; i < 6; i++) ctx.fillRect(x + 18, y - 380 + i * 60, w - 36, 12);
  // paw
  ctx.fillStyle = "#f2a65a"; ctx.beginPath(); ctx.ellipse(x + w / 2, y + 70, w / 2, 62, 0, 0, 7); ctx.fill();
  ctx.fillStyle = "#ffb3c1";
  ctx.beginPath(); ctx.ellipse(x + w / 2, y + 88, 26, 20, 0, 0, 7); ctx.fill();
  for (const [dx, dy] of [[-34, 50], [-12, 38], [12, 38], [34, 50]]) { ctx.beginPath(); ctx.ellipse(x + w / 2 + dx, y + 60 + dy, 10, 12, 0, 0, 7); ctx.fill(); }
  ctx.restore();

function drawChar(c) {

  ctx.fillStyle = g;

  ctx.lineTo(w / 2, -6); ctx.quadraticCurveTo(w / 2, 0, w / 2 - 6, 0); ctx.lineTo(-w / 2 + 6, 0); ctx.quadraticCurveTo(-w / 2, 0, -w / 2, -6); ctx.closePath(); ctx.fill();

  // eyes
  const scared = hazards.some(h => (h.type === "drop" && !h.landed && Math.abs(h.x + h.w / 2 - x) < h.w) || (h.type === "saw" && Math.abs(h.x - x) < 120));

  ctx.restore(); ctx.globalAlpha = 1;
}
function groundBelow(c) {
  let g = FLOOR;
  for (const p of platforms) if (c.x + c.w > p.x && c.x < p.x + p.w && p.y >= c.y + c.h - 2 && p.y < g) g = p.y;

}
function drawLabel(c) {
  const x = c.x + c.w / 2, y = c.y - (c.isPlayer ? 16 : 8);
  ctx.font = "800 12px Nunito, sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const label = c.name;

  ctx.fillStyle = c.isPlayer ? "rgba(255,107,87,.95)" : "rgba(27,20,48,.6)"; rr(x - tw / 2, y - 18, tw, 16, 8); ctx.fill();

    ctx.font = "700 13px Nunito, sans-serif";
    const bw = ctx.measureText(c.say).width + 18, bx = clamp(x - bw / 2, 6, W - bw - 6), by = y - 62;
    ctx.fillStyle = "#fff"; rr(bx, by, bw, 24, 12); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x - 6, by + 23); ctx.lineTo(x, by + 32); ctx.lineTo(x + 5, by + 23); ctx.fill();
    ctx.fillStyle = "#2b1d3a"; ctx.fillText(c.say, bx + bw / 2, by + 12.5);

function drawLava() {
  const g = ctx.createLinearGradient(0, lava, 0, FLOOR + 30); g.addColorStop(0, "#ffb72b"); g.addColorStop(.3, "#ff6b2a"); g.addColorStop(1, "#c42a12");
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(LW, FLOOR + 30);
  for (let x = LW; x <= RW; x += 12) ctx.lineTo(x, lava + Math.sin(x * .05 + tAll * 4) * 4 + Math.sin(x * .13 - tAll * 3) * 2);
  ctx.lineTo(RW, FLOOR + 30); ctx.fill();
  ctx.fillStyle = "rgba(255,240,150,.5)"; for (let i = 0; i < 6; i++) { const x = LW + ((i * 151 + tAll * 40) % (RW - LW)); ctx.beginPath(); ctx.ellipse(x, lava + 10, 14, 3, 0, 0, 7); ctx.fill(); }
}

function drawDark() {
  ctx.save();
  ctx.fillStyle = `rgba(8,5,16,${.93 * dark})`;
  ctx.beginPath(); ctx.rect(0, 0, W, H);
  // cut out light around each living character (the player gets a bigger one)
  for (const c of chars) if (c.alive) { const r = c.isPlayer ? 120 : 42; ctx.moveTo(c.x + 17 + r, c.y + 17); ctx.arc(c.x + 17, c.y + 17, r, 0, Math.PI * 2, true); }
  ctx.fill("evenodd");
  ctx.restore();
  // glowing edge around player light
  if (player && player.alive) { const g = ctx.createRadialGradient(player.x + 17, player.y + 17, 60, player.x + 17, player.y + 17, 124); g.addColorStop(0, "rgba(8,5,16,0)"); g.addColorStop(1, `rgba(8,5,16,${.8 * dark})`); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(player.x + 17, player.y + 17, 124, 0, 7); ctx.fill(); }

}

function drawHUD() {
  if (phase === "menu") return;
  // leaderboard
  const alive = chars.filter(c => c.alive).sort((a, b) => b.coins - a.coins || b.hp - a.hp);
  const lx = W - 196, ly = 14;
  ctx.fillStyle = "rgba(20,14,36,.78)"; rr(lx, ly, 182, 26 + Math.min(alive.length, 6) * 19, 12); ctx.fill();
  ctx.font = "900 11px Nunito"; ctx.textAlign = "left"; ctx.textBaseline = "middle"; ctx.fillStyle = "#b7a9d1";
  ctx.fillText(`STILL RIDING · ${alive.length}`, lx + 12, ly + 14);
  alive.slice(0, 6).forEach((c, i) => {
    const y = ly + 33 + i * 19;
    ctx.fillStyle = c.color; ctx.beginPath(); ctx.arc(lx + 17, y, 5, 0, 7); ctx.fill();
    ctx.fillStyle = c.isPlayer ? "#ffd84a" : "#fff6e8"; ctx.font = (c.isPlayer ? "900" : "700") + " 12px Nunito";
    ctx.fillText(`${i + 1}. ${c.name}`, lx + 28, y);
    ctx.textAlign = "right"; ctx.fillStyle = "#ffd84a"; ctx.fillText(`${c.coins}●`, lx + 170, y); ctx.textAlign = "left";
  });
  // player status
  if (player) {
    ctx.fillStyle = "rgba(20,14,36,.78)"; rr(14, 14, 200, 52, 12); ctx.fill();
    ctx.fillStyle = "#ff4d6d"; for (let i = 0; i < 3; i++) { ctx.globalAlpha = i < player.hp ? 1 : .2; drawHeart(32 + i * 22, 33, 7); } ctx.globalAlpha = 1;
    ctx.fillStyle = "#ffd84a"; ctx.font = "900 14px Nunito"; ctx.textAlign = "left"; ctx.fillText(`● ${player.coins}`, 100, 34);
    ctx.fillStyle = "#b7a9d1"; ctx.font = "800 11px Nunito"; ctx.fillText(`FLOOR ${floor}  ·  SCORE ${floor * 100 + player.coins * 25}`, 26, 55);
  }
  // event timer bar
  if (phase === "event" && ev) {
    const k = 1 - evT / ev.dur;
    ctx.fillStyle = "rgba(20,14,36,.7)"; rr(W / 2 - 100, H - 26, 200, 10, 5); ctx.fill();
    ctx.fillStyle = ev.tint; rr(W / 2 - 100, H - 26, 200 * k, 10, 5); ctx.fill();
    ctx.font = "800 11px Nunito"; ctx.fillStyle = "#b7a9d1"; ctx.textAlign = "center"; ctx.fillText(ev.name.toUpperCase() + " · NEXT FLOOR IN " + Math.ceil(ev.dur - evT) + "s", W / 2, H - 38);
  }
  if (phase === "ride") {
    ctx.font = "800 13px Nunito"; ctx.fillStyle = "#b7a9d1"; ctx.textAlign = "center";
    ctx.fillText(floor === 0 ? "Going up… hold on to something" : "Going up… catch your breath", W / 2, H - 30);
  }

  ctx.textAlign = "left"; ctx.font = "800 12px Nunito";
  feed.forEach((f, i) => {
    const y = 84 + i * 22; ctx.globalAlpha = clamp(f.t, 0, 1);
    const tw = ctx.measureText(f.text).width + 18;
    ctx.fillStyle = "rgba(20,14,36,.7)"; rr(14, y - 10, tw, 20, 10); ctx.fill();
    ctx.fillStyle = f.color; ctx.fillText(f.text, 23, y + 1);
  });
  ctx.globalAlpha = 1;
  // banner
  if (banner) {
    const t = banner.t, a = t < .3 ? t / .3 : t > 2.5 ? (3 - t) / .5 : 1;
    const s = t < .3 ? .8 + .2 * (t / .3) + Math.sin(t * 20) * .05 : 1;
    ctx.save(); ctx.globalAlpha = clamp(a, 0, 1); ctx.translate(W / 2, 220); ctx.scale(s, s);
    ctx.fillStyle = "rgba(20,14,36,.88)"; rr(-250, -56, 500, 112, 22); ctx.fill();
    ctx.strokeStyle = banner.tint; ctx.lineWidth = 4; ctx.stroke();
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillStyle = banner.tint; ctx.font = "900 14px Nunito"; ctx.fillText(`FLOOR ${banner.floor}`, 0, -32);
    ctx.fillStyle = "#fff6e8"; ctx.font = "700 38px Fredoka, sans-serif"; ctx.fillText(banner.name, 0, 2);
    ctx.fillStyle = "#b7a9d1"; ctx.font = "700 14px Nunito"; ctx.fillText(banner.sub, 0, 36);
    ctx.restore();
  }
}

function shade(hex, amt) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp((n >> 16) + amt, 0, 255), g = clamp(((n >> 8) & 255) + amt, 0, 255), b = clamp((n & 255) + amt, 0, 255);
  return `rgb(${r},${g},${b})`;
}
